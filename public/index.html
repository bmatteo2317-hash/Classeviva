<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiche Classeviva</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1, h2 { text-align: center; color: #0066cc; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #0066cc; color: white; border: none; padding: 12px; margin-top: 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #004999; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 6px; margin-top: 15px; text-align: center; display: none; }
        .results { display: none; margin-top: 25px; }
        .stat-card { background: #ebf3fc; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .materia-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
        .loader { text-align: center; display: none; font-weight: bold; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Statistiche Scuola</h1>
    
    <!-- Modulo di Login -->
    <div id="login-form">
        <label for="username">Username ID (es. s1234567)</label>
        <input type="text" id="username" placeholder="es. s1234567...">
        
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="La tua password...">
        
        <button onclick="caricaDati()">Visualizza Statistiche</button>
        <div id="loader" class="loader">Elaborazione dati in corso...</div>
        <div id="error-box" class="error"></div>
    </div>

    <!-- Schermata Risultati -->
    <div id="results" class="results">
        <h2>I tuoi Risultati</h2>
        <div class="stat-card">
            <p><strong>Media Generale:</strong> <span id="media-gen" style="font-size: 20px; color: #0066cc;"></span></p>
            <p>• Voti totali analizzati: <span id="voti-tot"></span></p>
            <p>• Voto più alto: <span id="voto-max"></span> | Voto più basso: <span id="voto-min"></span></p>
        </div>
        
        <h3>Dettaglio per Materia</h3>
        <div id="lista-materie"></div>
        <button onclick="window.location.reload()" style="background: #666;">Indietro</button>
    </div>
</div>

<script>
async function caricaDati() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorBox = document.getElementById('error-box');
    const loader = document.getElementById('loader');

    errorBox.style.display = 'none';
    if(!user || !pass) {
        errorBox.innerText = "Inserisci sia l'username che la password.";
        errorBox.style.display = 'block';
        return;
    }

    loader.style.display = 'block';

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });

        const data = await response.json();
        loader.style.display = 'none';

        if (!data.success) {
            errorBox.innerText = data.error || "Errore sconosciuto.";
            errorBox.style.display = 'block';
            return;
        }

        document.getElementById('login-form').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        
        document.getElementById('media-gen').innerText = data.statistiche.mediaGenerale;
        document.getElementById('voti-tot').innerText = data.statistiche.conteggioVoti;
        document.getElementById('voto-max').innerText = data.statistiche.votoMassimo;
        document.getElementById('voto-min').innerText = data.statistiche.votoMinimo;

        const listaHtml = document.getElementById('lista-materie');
        listaHtml.innerHTML = '';
        data.medieMaterie.forEach(m => {
            listaHtml.innerHTML += `
                <div class="materia-item">
                    <span><strong>${m.materia}</strong> (${m.votiTotali} voti)</span>
                    <span style="font-weight: bold; color: ${m.media >= 6 ? 'green' : 'red'}">${m.media}</span>
                </div>
            `;
        });

    } catch (err) {
        loader.style.display = 'none';
        errorBox.innerText = "Errore di connessione di rete.";
        errorBox.style.display = 'block';
    }
}
</script>
</body>
</html>
